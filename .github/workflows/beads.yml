name: Drizzlet
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['drizzlet-*']
    # Docs-only pushes skip the firmware build; tag pushes ignore paths and always build.
    # Of the Markdown under beads/, the release zip packs only OPTIONS.md; vanilla trees stay in.
    paths: ['beads/**', 'clouds/**', 'plaits/**', 'rings/**', 'stmlib', 'stm_audio_bootloader', '.gitmodules', '.github/workflows/beads.yml',
            '!beads/**/*.md', 'beads/build/docs/OPTIONS.md']
  pull_request:
    paths: ['beads/**', 'clouds/**', 'plaits/**', 'rings/**', 'stmlib', 'stm_audio_bootloader', '.gitmodules', '.github/workflows/beads.yml']
permissions:
  contents: read
concurrency:
  # Each tagged release build gets its own group, so it is never cancelled.
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      blob-out: ${{ steps.emulator-inputs.outputs.blob-out }}
      rings-out: ${{ steps.emulator-inputs.outputs.rings-out }}
    env:
      # Published by the image job below from drizzlet 90496334, whose recipe hash this is;
      # used only while this checkout's recipe matches. Update both from the image job's summary.
      TOOLCHAIN_IMAGE: ghcr.io/insolentconstruct/mi-toolchain@sha256:193a7cd574a9bbda350d4c7006e45263d1210369d307dd56e55a95482e706568
      TOOLCHAIN_RECIPE: 7881893d9984543c63e0bf89398317ef224ce7f1af1500d53c9253c8016935fa
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      # The recipe is the Dockerfile and .dockerignore, which fix the base image, packages and archive hashes.
      - name: Pull the published compiler image if this recipe built it
        id: pull
        shell: bash
        run: |
          recipe=$( (cd beads/build && sha256sum Dockerfile .dockerignore) | sha256sum | cut -c1-64)
          if [[ "$recipe" != "$TOOLCHAIN_RECIPE" ]]; then
            echo "The recipe changed ($recipe); building the image."
          elif docker pull --platform linux/amd64 "$TOOLCHAIN_IMAGE"; then
            docker tag "$TOOLCHAIN_IMAGE" drizzlet
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            echo "The pull failed; building the image."
          fi
      # Toolchain archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        if: steps.pull.outputs.pulled != 'true'
        id: toolchains
        run: |
          tc=$(sed -n 's/^ARG TC_SHA256=//p' beads/build/Dockerfile)
          gcc9=$(sed -n 's/^ARG GCC9_SHA256=//p' beads/build/Dockerfile)
          echo "key=toolchains-$tc-$gcc9" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        if: steps.pull.outputs.pulled != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.pull.outputs.pulled != 'true' && steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p beads/build/.toolchains
          for name in TC GCC9; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" beads/build/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" beads/build/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "beads/build/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  beads/build/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.pull.outputs.pulled != 'true' && steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build pinned amd64 compiler and encoder
        if: steps.pull.outputs.pulled != 'true'
        run: |
          docker build --platform linux/amd64 --target compiler \
            --build-arg TC_LOCAL=.toolchains/TC.tar.bz2 --build-arg GCC9_LOCAL=.toolchains/GCC9.tar.bz2 \
            -t drizzlet beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        env:
          RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/drizzlet-') && github.ref_name || 'drizzlet-dev' }}
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - name: Build the unchanged 4.9.3 golden app
        run: bash beads/build/golden.sh "$PWD/golden"
      - name: Gate the model blobs, the services link and their negative controls
        run: |
          mkdir -p blob-out
          docker run --rm --platform linux/amd64 --network none --user "$(id -u):$(id -g)" -w /src \
            --mount "type=bind,src=$PWD,dst=/src,readonly" --mount "type=bind,src=$PWD/blob-out,dst=/out" drizzlet \
            bash -c 'bash beads/test/blob_emu/build.sh /out/emu && bash beads/build/tools/blob_gate_test.sh /out/negative && bash beads/test/libm_blob_emu/build.sh /out/libm'
      - name: Check the Rings synth's source against vanilla Rings, gate its blob, build the references
        run: |
          mkdir -p rings-out
          docker run --rm --platform linux/amd64 --network none --user "$(id -u):$(id -g)" -w /src \
            --mount "type=bind,src=$PWD,dst=/src,readonly" --mount "type=bind,src=$PWD/rings-out,dst=/out" drizzlet \
            bash -c 'python3 beads/build/tools/rings_vanilla.py self-test --cpp arm-none-eabi-g++ && bash beads/test/rings_emu/build.sh /out'
      # The emulator jobs compare these exact bytes; each checks the tar's hash before use.
      - name: Pack the emulator inputs
        id: emulator-inputs
        run: |
          for name in blob-out rings-out; do
            tar --sort=name -cf "$name.tar" "$name"
            echo "$name=$(sha256sum "$name.tar" | cut -c1-64)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-inputs
          if-no-files-found: error
          compression-level: 0
          path: |
            blob-out.tar
            rings-out.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-release-assets
          if-no-files-found: error
          path: |
            artifacts/drizzlet-*.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/region.bin
            artifacts/image.bin
            artifacts/drizzlet-*-combo.bin
            artifacts/drizzlet-*-combo.hex
            artifacts/NOTICE.txt
            artifacts/profile-features.json
            artifacts/OPTIONS.md
            artifacts/options-guide.svg
            artifacts/options-guide-mobile.svg
            artifacts/SHA256SUMS
            artifacts/drizzlet-*.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-build-proof
          if-no-files-found: error
          path: |
            golden/app.bin
            golden/app.elf
            golden/*.log
            golden/source-commits.txt
            golden/SHA256SUMS
            artifacts/NOTICE.txt
            golden/objects/beads/objects.txt
            golden/objects/beads/link.txt
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  compare-emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blob
            input: blob-out
          - name: rings
            input: rings-out
    name: compare-emulator (${{ matrix.name }})
    steps:
      # The same checkout and submodules as the build job.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: emulator-inputs
      - name: Check the inputs are the build job's bytes
        env:
          INPUT: ${{ matrix.input }}
          EXPECTED: ${{ matrix.input == 'blob-out' && needs.build.outputs.blob-out || needs.build.outputs.rings-out }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]
          echo "$EXPECTED  $INPUT.tar" | sha256sum --strict -c -
          tar -xf "$INPUT.tar"
      - name: Install the Cortex-M7 emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/emu"
          "$RUNNER_TEMP/emu/bin/pip" install --no-cache-dir unicorn==2.1.4
      - name: Compare blob and compiled-in renders under the Cortex-M7 emulator
        if: matrix.name == 'blob'
        run: |
          "$RUNNER_TEMP/emu/bin/python" beads/test/blob_emu/run_profiles.py blob-out/emu
          "$RUNNER_TEMP/emu/bin/python" beads/test/libm_blob_emu/compare.py blob-out/libm
      - name: Compare the Rings synth blob with vanilla Rings under the Cortex-M7 emulator
        if: matrix.name == 'rings'
        run: '"$RUNNER_TEMP/emu/bin/python" beads/test/rings_emu/rings_compare.py rings-out'
  release-emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        include:
          - shard: 1
            scenarios: steady media
          - shard: 2
            scenarios: clouds_style processor saved_clouds
          - shard: 3
            scenarios: freeze_fade gestures
          - shard: 4
            scenarios: ui synth release_synth chiptune_drone
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drizzlet-release-assets
          path: artifacts
      - name: Install the Cortex-M7 emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/emu"
          "$RUNNER_TEMP/emu/bin/pip" install --no-cache-dir unicorn==2.1.4 pyelftools==0.32
      - name: Check release region boots and fallback
        run: |
          timeout 1200 "$RUNNER_TEMP/emu/bin/python" beads/test/transition_emu/region_boots.py \
            artifacts/app.elf artifacts/region.bin region-boots.json --shard ${{ matrix.shard }}/4
      - name: Check release transitions and bank ownership
        run: |
          timeout 1200 "$RUNNER_TEMP/emu/bin/python" beads/test/transition_emu/transition_emu.py \
            --summary --region artifacts/region.bin artifacts/app.elf transitions.json ${{ matrix.scenarios }}
      - name: Check fixed reverb decay profiles
        if: matrix.shard == 4
        run: |
          timeout 180 "$RUNNER_TEMP/emu/bin/python" beads/test/transition_emu/reverb_decay.py \
            artifacts/app.elf --region artifacts/region.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-emulator-${{ matrix.shard }}
          path: |
            region-boots.json
            transitions.json
  image:
    # Publishes the build image after a green build on drizzlet, so users can pull it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/drizzlet' && github.repository == 'insolentconstruct/eurorack'
    needs: [build, compare-emulator, release-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      # No local archives: the Dockerfile downloads both toolchains and checks their pinned hashes.
      - name: Build the image
        run: |
          recipe=$( (cd beads/build && sha256sum Dockerfile .dockerignore) | sha256sum | cut -c1-64)
          docker build --platform linux/amd64 --target compiler --label "org.beads.recipe=$recipe" -t drizzlet beads/build
          echo "Recipe \`$recipe\`" >> "$GITHUB_STEP_SUMMARY"
      # The build job may use a pulled image, so prove this one reproduces the pinned hashes.
      - name: Check the image reproduces the firmware and WAV hashes
        run: bash beads/build/build.sh "$PWD/image-check" --wav
      - name: Push to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          image=ghcr.io/insolentconstruct/mi-toolchain
          docker login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          for tag in gcc9-2020q2 "$SHA"; do
            docker tag drizzlet "$image:$tag"
            docker push "$image:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:gcc9-2020q2")
          echo "Pushed $digest"
          echo "Pushed \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
  release:
    if: startsWith(github.ref, 'refs/tags/drizzlet-')
    needs: [build, compare-emulator, release-emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            beads/build/publish.sh
            beads/build/CHANGELOG.md
            beads/build/release-notes/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drizzlet-release-assets
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash beads/build/publish.sh "$GITHUB_REF_NAME" artifacts
