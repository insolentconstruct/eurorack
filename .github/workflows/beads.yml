name: Drizzlet
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['drizzlet-*']
  pull_request:
    paths: ['beads/**', 'stmlib', 'stm_audio_bootloader', '.github/workflows/beads.yml']
permissions:
  contents: read
concurrency:
  # Each tagged release build gets its own group, so it is never cancelled.
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      - name: Build pinned amd64 compiler and encoder
        run: |
          docker build --platform linux/amd64 --target compiler -t beads-build-kit beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        env:
          RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/drizzlet-') && github.ref_name || 'drizzlet-dev' }}
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - name: Build the unchanged 4.9.3 golden app
        run: bash beads/build/golden.sh "$PWD/golden"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-release-assets
          if-no-files-found: error
          path: |
            artifacts/drizzlet-*.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/drizzlet-*-combo.bin
            artifacts/NOTICE.txt
            artifacts/SHA256SUMS
            artifacts/drizzlet-*.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-build-proof
          if-no-files-found: error
          path: |
            golden/app.bin
            golden/app.elf
            golden/*.log
            golden/source-commits.txt
            golden/SHA256SUMS
            artifacts/NOTICE.txt
            golden/objects/beads/objects.txt
            golden/objects/beads/link.txt
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  release:
    if: startsWith(github.ref, 'refs/tags/drizzlet-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            beads/build/publish.sh
            beads/build/CHANGELOG.md
            beads/build/release-notes/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drizzlet-release-assets
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash beads/build/publish.sh "$GITHUB_REF_NAME" artifacts
