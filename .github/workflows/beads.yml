name: Beads released source
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['beads-*']
  pull_request:
    paths: ['beads/**', 'stmlib', 'stm_audio_bootloader', '.github/workflows/beads.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      - name: Build pinned amd64 compiler and Buster pinned-CPU encoder
        run: |
          docker build --platform linux/amd64 --target compiler -t beads-build-kit beads/build
          docker build --platform linux/amd64 --target encoder -t beads-encoder beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        env:
          BEADS_RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/beads-') && github.ref_name || 'beads-dev' }}
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-release-assets
          if-no-files-found: error
          path: |
            artifacts/beads-*.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/beads-*-combo.bin
            artifacts/NOTICE.txt
            artifacts/SHA256SUMS
            artifacts/beads-*.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-build-proof
          if-no-files-found: error
          path: |
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  release:
    if: startsWith(github.ref, 'refs/tags/beads-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-release-assets
          path: artifacts
      - name: Verify assets and publish the reviewed kit tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          printf '%s\n' \
            'Unofficial community build; not made or supported by Emilie Gillet or Mutable Instruments, and not a Mutable Instruments product.' \
            'Emilie Gillet: "Code provided as is, builds on a Desktop platform but not verified to build and run on a module. Install at your own risks."' \
            'Please do not contact Emilie Gillet or Mutable Instruments about this build; report problems in this repository.' \
            "Reviewed build-kit commit: $GITHUB_SHA (this tag)." \
            'Upstream released source: d8f473915232af74347762b6365202bfd26f73f6.' \
            'WAV built and freshly decoded in this run, with negative controls.' \
            'Flash with the official Beads update procedure in the zip README.txt.' \
            'Tested playback: a 44.1 kHz line output; see README.txt for the 48 kHz stress note.' \
            'Copyright and permission notices: NOTICE.txt.' > release-notes.txt
          assets=("artifacts/$RELEASE_TAG-wav.zip" "artifacts/$RELEASE_TAG-combo.zip"
                  artifacts/NOTICE.txt artifacts/SHA256SUMS)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-run or partial earlier publish: make the release match this run exactly.
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest \
              --title "Unofficial Beads build ${RELEASE_TAG#beads-}" --notes-file release-notes.txt
            gh release upload "$RELEASE_TAG" --clobber --repo "$GITHUB_REPOSITORY" "${assets[@]}"
            wanted=$(for f in "${assets[@]}"; do basename "$f"; done | sort)
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
              while IFS= read -r name; do
                grep -qxF "$name" <<<"$wanted" || gh release delete-asset "$RELEASE_TAG" "$name" --yes --repo "$GITHUB_REPOSITORY"
              done
          else
            gh release create "$RELEASE_TAG" --verify-tag --latest \
              --repo "$GITHUB_REPOSITORY" --title "Unofficial Beads build ${RELEASE_TAG#beads-}" \
              --notes-file release-notes.txt "${assets[@]}"
          fi
          # Verify what is actually published matches this run's checked assets.
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          for f in "${assets[@]}"; do cmp "$f" "published/$(basename "$f")"; done
          # The release must be public (not a leftover draft or a pre-release).
          state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          [ "$state" = "false false" ] || { echo "release is not published: draft/prerelease = $state" >&2; exit 1; }
          # The published asset set must be exactly this run's set: nothing extra, nothing missing.
          diff <(for f in "${assets[@]}"; do basename "$f"; done | sort) <(find published -maxdepth 1 -type f -printf "%f\n" | sort)
