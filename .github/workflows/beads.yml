name: Drizzlet
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['drizzlet-*']
  pull_request:
    paths: ['beads/**', 'palette/**', 'stmlib', 'stm_audio_bootloader', '.github/workflows/beads.yml']
permissions:
  contents: read
concurrency:
  # Each tagged release build gets its own group, so it is never cancelled.
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      # Toolchain archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          tc=$(sed -n 's/^ARG TC_SHA256=//p' beads/build/Dockerfile)
          gcc9=$(sed -n 's/^ARG GCC9_SHA256=//p' beads/build/Dockerfile)
          echo "key=toolchains-$tc-$gcc9" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p beads/build/.toolchains
          for name in TC GCC9; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" beads/build/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" beads/build/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "beads/build/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  beads/build/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build pinned amd64 compiler and encoder
        run: |
          docker build --platform linux/amd64 --target compiler \
            --build-arg TC_LOCAL=.toolchains/TC.tar.bz2 --build-arg GCC9_LOCAL=.toolchains/GCC9.tar.bz2 \
            -t beads-build-kit beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        env:
          RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/drizzlet-') && github.ref_name || 'drizzlet-dev' }}
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - name: Browser encoder makes the same WAV
        run: |
          node --version
          git fetch --no-tags --depth=1 origin '+refs/tags/drizzlet-*:refs/tags/drizzlet-*'
          node palette/test/golden.js artifacts/app.bin "$(cut -c1-64 beads/build/expected-wav.sha256)"
          node palette/test/manifest.js
      - name: Build the unchanged 4.9.3 golden app
        run: bash beads/build/golden.sh "$PWD/golden"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-release-assets
          if-no-files-found: error
          path: |
            artifacts/drizzlet-*.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/drizzlet-*-combo.bin
            artifacts/NOTICE.txt
            artifacts/OPTIONS.md
            artifacts/options-guide.svg
            artifacts/options-guide-mobile.svg
            artifacts/SHA256SUMS
            artifacts/drizzlet-*.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drizzlet-build-proof
          if-no-files-found: error
          path: |
            golden/app.bin
            golden/app.elf
            golden/*.log
            golden/source-commits.txt
            golden/SHA256SUMS
            artifacts/NOTICE.txt
            golden/objects/beads/objects.txt
            golden/objects/beads/link.txt
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  release:
    if: startsWith(github.ref, 'refs/tags/drizzlet-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            beads/build/publish.sh
            beads/build/CHANGELOG.md
            beads/build/release-notes/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: drizzlet-release-assets
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash beads/build/publish.sh "$GITHUB_REF_NAME" artifacts
