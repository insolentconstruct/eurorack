name: Beads vanilla source
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['beads-*']
  pull_request:
    paths: ['beads/**', 'stmlib', 'stm_audio_bootloader', '.github/workflows/beads.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      # Toolchain archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          tc=$(sed -n 's/^ARG TC_SHA256=//p' beads/build/Dockerfile)
          echo "key=toolchains-$tc" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p beads/build/.toolchains
          for name in TC; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" beads/build/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" beads/build/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "beads/build/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  beads/build/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build pinned amd64 compiler and Buster pinned-CPU encoder
        run: |
          docker build --platform linux/amd64 --target compiler --build-arg TC_LOCAL=.toolchains/TC.tar.bz2 \
            -t beads-build-kit beads/build
          docker build --platform linux/amd64 --target encoder -t beads-encoder beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        env:
          BEADS_RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/beads-') && github.ref_name || 'beads-dev' }}
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-release-assets
          if-no-files-found: error
          path: |
            artifacts/beads-*.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/beads-*-combo.bin
            artifacts/beads-*-combo.hex
            artifacts/NOTICE.txt
            artifacts/SHA256SUMS
            artifacts/beads-*.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-build-proof
          if-no-files-found: error
          path: |
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  release:
    if: startsWith(github.ref, 'refs/tags/beads-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout: beads/build/publish.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-release-assets
          path: artifacts
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash beads/build/publish.sh "$GITHUB_REF_NAME" artifacts
