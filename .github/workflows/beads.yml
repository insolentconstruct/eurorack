name: Beads released source
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['beads-*']
  pull_request:
    paths: ['beads/**', 'stmlib', 'stm_audio_bootloader', '.github/workflows/beads.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize only Beads dependencies
        run: git submodule update --init stmlib stm_audio_bootloader
      - name: Build pinned amd64 compiler and Buster encoder
        run: |
          docker build --platform linux/amd64 --target compiler -t beads-build-kit beads/build
          docker build --platform linux/amd64 --target encoder -t beads-encoder beads/build
      - name: Build hashes, new WAV, vendor decode proof and deterministic zip
        run: bash beads/build/build.sh "$PWD/artifacts" --wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-release-assets
          if-no-files-found: error
          path: |
            artifacts/beads-d8f4739-released.zip
            artifacts/app.bin
            artifacts/app.elf
            artifacts/bootloader.bin
            artifacts/bootloader-padded.bin
            artifacts/combo.bin
            artifacts/NOTICE.txt
            artifacts/SHA256SUMS
            artifacts/beads-d8f4739-released.wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-build-proof
          if-no-files-found: error
          path: |
            artifacts/decode-proof.json
            artifacts/notice-inventory.json
            artifacts/*.log
            artifacts/objects/*/objects.txt
            artifacts/objects/*/link.txt
            artifacts/objects/*/*.map
  release:
    if: startsWith(github.ref, 'refs/tags/beads-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-release-assets
          path: artifacts
      - name: Verify assets and publish the reviewed kit tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd artifacts && sha256sum -c SHA256SUMS)
          printf '%s\n' \
            'Unofficial Beads build; not a Mutable Instruments product.' \
            "Reviewed build-kit commit: $GITHUB_SHA (this tag)." \
            'Upstream released source: d8f473915232af74347762b6365202bfd26f73f6.' \
            'WAV built and freshly decoded in this run, with negative controls.' \
            'Use the qualified 44.1 kHz line-level playback procedure in the zip README.' \
            'The recorded 48 kHz stress limitation remains; notices accompany binaries.' > release-notes.txt
          gh release create "$RELEASE_TAG" --verify-tag --latest=false \
            --repo "$GITHUB_REPOSITORY" --title "Unofficial Beads $RELEASE_TAG" \
            --notes-file release-notes.txt \
            artifacts/beads-d8f4739-released.zip artifacts/app.bin artifacts/app.elf \
            artifacts/bootloader.bin artifacts/bootloader-padded.bin artifacts/combo.bin \
            artifacts/NOTICE.txt artifacts/SHA256SUMS
