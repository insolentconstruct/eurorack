name: Beads base
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git submodule update --init stmlib stm_audio_bootloader
      - run: docker build --platform linux/amd64 -t beads-build-kit:gcc9 beads/build
      - run: RELEASE_NAME=beads-base-ci beads/build/build.sh /tmp/beads-base-one --wav
      - run: RELEASE_NAME=beads-base-ci beads/build/build.sh /tmp/beads-base-two --wav
      - run: diff /tmp/beads-base-one/SHA256SUMS /tmp/beads-base-two/SHA256SUMS
      - run: beads/test/run.sh /tmp/beads-base-tests
