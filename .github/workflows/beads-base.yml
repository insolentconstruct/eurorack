name: Beads base
on:
  push:
    paths: ['beads/**', 'tools/**', 'stmlib', 'stm_audio_bootloader', '.gitmodules', 'README-BASE.md', '.github/workflows/beads-base.yml']
  pull_request:
    paths: ['beads/**', 'tools/**', 'stmlib', 'stm_audio_bootloader', '.gitmodules', 'README-BASE.md', '.github/workflows/beads-base.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      # Toolchain archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          tc=$(sed -n 's/^ARG TC_SHA256=//p' beads/build/Dockerfile)
          gcc9=$(sed -n 's/^ARG GCC9_SHA256=//p' beads/build/Dockerfile)
          echo "key=toolchains-$tc-$gcc9" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p beads/build/.toolchains
          for name in TC GCC9; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" beads/build/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" beads/build/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "beads/build/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  beads/build/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build shared kit
        run: |
          docker build --platform linux/amd64 \
            --build-arg TC_LOCAL=.toolchains/TC.tar.bz2 --build-arg GCC9_LOCAL=.toolchains/GCC9.tar.bz2 \
            -t beads-build-kit:gcc9 beads/build
          docker save --output /tmp/beads-build-kit.tar beads-build-kit:gcc9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-build-kit
          path: /tmp/beads-build-kit.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  host-tests:
    needs: build-kit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init stmlib stm_audio_bootloader
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-build-kit
          path: /tmp/beads-build-kit
      - name: Load build kit
        run: docker load --input /tmp/beads-build-kit/beads-build-kit.tar
      - name: Run host tests, storage compatibility and audio reference
        run: beads/test/run.sh "$RUNNER_TEMP/host-tests"
      - name: Check the settings sector tool against stmlib's loader
        run: make -f beads/build/tools/settings_sector.mk test
  release-build:
    needs: build-kit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [one, two]
    name: release (${{ matrix.replica }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init stmlib stm_audio_bootloader
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-build-kit
          path: /tmp/beads-build-kit
      - name: Load build kit
        run: docker load --input /tmp/beads-build-kit/beads-build-kit.tar
      - name: Build reproducible release
        run: JOBS="$(nproc)" RELEASE_NAME=beads-base-ci beads/build/build.sh "$RUNNER_TEMP/release" --wav
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.replica }}
          path: ${{ runner.temp }}/release/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
  compare-releases:
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: manifests
      - name: Compare release manifests
        run: diff -u manifests/release-one/SHA256SUMS manifests/release-two/SHA256SUMS
