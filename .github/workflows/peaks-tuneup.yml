name: Peaks tuneup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init stmlib stm_audio_bootloader
      # A checkout writes resources.cc before the scripts that generate it,
      # and make would then regenerate it with today's stmlib.
      - name: Keep the committed resources
        run: touch peaks/resources.cc
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: insolentconstruct/mutable-dev-environment
          ref: 7ce2692e9fe54be5c12c7169b4da16ccd1f5ff21
          path: mutable-dev-environment
          persist-credentials: false
      - name: Build the images
        run: |
          mutable-dev-environment/mutable image
          mutable-dev-environment/mutable compilers --compiler 15.3.Rel2
      - name: Host render tests
        run: mutable-dev-environment/mutable -C . render peaks
      # The application and update file use GCC 15.3; the bootloader stays on
      # the makefile's GCC 4.8.
      - name: Build the application, bootloader and update file
        env:
          MUTABLE_IMAGE: mutable-dev:gcc-15.3.Rel2
        run: |
          mutable-dev-environment/mutable -C . make -f peaks/makefile
          mutable-dev-environment/mutable -C . make TOOLCHAIN_PATH=/usr/local/arm-4.8.3/ -f peaks/bootloader/makefile
          mutable-dev-environment/mutable -C . make -f peaks/makefile wav
      - name: Check firmware hashes
        run: sha256sum -c peaks/tuneup/expected-hashes.sha256
