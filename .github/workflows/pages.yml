name: Drizzlet Hygrostat site

on:
  push:
    branches: [drizzlet]
    paths:
      - 'palette/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'palette/**'
      - 'beads/profile.*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0
  HUGO_SHA256: fada83ad56bb27ed4cb7dd81590303bdac16140f944ac4e66fc248117e2d5594

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history: the profile test checks the working parser against
          # the pinned firmware once that commit is an ancestor.
          fetch-depth: 0
      - name: The pinned images still encode to their release files
        run: |
          node --version
          git submodule update --init --depth=1 stmlib
          # The JavaScript template literal is meant for node, not the shell.
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            for (const r of JSON.parse(readFileSync("palette/static/manifest.json")).releases) {
              execFileSync("git", ["fetch", "--no-tags", "--depth=1", "origin",
                r.development ? r.source_commit : `refs/tags/${r.tag}:refs/tags/${r.tag}`], { stdio: "inherit" });
            }'
          node palette/test/manifest.js
          node palette/test/profile.js
          node palette/test/downloads.js
          node palette/test/readiness.js
      - name: Install the pinned Hugo
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/$archive"
          echo "$HUGO_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" hugo
      - name: Build the site
        run: |
          "$RUNNER_TEMP/hugo" version
          "$RUNNER_TEMP/hugo" --source palette --destination "$PWD/public" --panicOnWarning
          # Served byte for byte as in the repository.
          diff -r palette/static public
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/drizzlet'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
