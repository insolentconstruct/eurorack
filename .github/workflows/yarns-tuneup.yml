name: Yarns tuneup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init stmlib stm_audio_bootloader
      # A checkout writes resources.cc before the scripts that generate it,
      # and make would then regenerate it with today's stmlib.
      - name: Keep the committed resources
        run: touch yarns/resources.cc
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: insolentconstruct/mutable-dev-environment
          ref: 7ce2692e9fe54be5c12c7169b4da16ccd1f5ff21
          path: mutable-dev-environment
          persist-credentials: false
      - name: Build the image
        run: mutable-dev-environment/mutable image
      - name: Build the application, bootloader and update file
        run: |
          mutable-dev-environment/mutable -C . make -f yarns/makefile
          mutable-dev-environment/mutable -C . make -f yarns/bootloader/makefile
          mutable-dev-environment/mutable -C . make -f yarns/makefile syx
      - name: Check firmware hashes
        run: sha256sum -c yarns/tuneup/expected-hashes.sha256
