name: Mutation check
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      - name: Build shared kit
        run: docker build --platform linux/amd64 -t beads-build-kit:gcc9 beads/build
      - name: Break the firmware in each recorded way; every test must fail
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-report"
          docker run --rm --network none -v "$PWD:/src" \
            -v "$RUNNER_TEMP/mutation-report:/out" -w /src beads-build-kit:gcc9 \
            python3 beads/test/mutation_check.py /out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          if-no-files-found: warn
          path: ${{ runner.temp }}/mutation-report/
