name: Mutation check
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['beads/**', 'plaits/**', 'clouds/**', 'stmlib', '.github/workflows/beads-mutation.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mutations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every 8th case from `shard`, so the 8 shards run each case once.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      - name: Break the firmware in each recorded way; every test must fail
        run: >-
          python3 beads/test/mutation_check.py --shard ${{ matrix.shard }}/8
          "$PWD/mutation-report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: mutation-report/
  report:
    needs: mutations
    # Runs even when a shard failed, so this check fails instead of skipping.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutations.result }}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-shard-*
          path: shards
      - name: Merge the shards; every case must have run
        run: python3 beads/test/mutation_check.py --merge "$PWD/mutation-report" shards/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          if-no-files-found: error
          path: mutation-report/
