name: Mutation check
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['beads/**', 'stmlib', '.gitmodules', '.github/workflows/beads-mutation.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      # Toolchain archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          tc=$(sed -n 's/^ARG TC_SHA256=//p' beads/build/Dockerfile)
          gcc9=$(sed -n 's/^ARG GCC9_SHA256=//p' beads/build/Dockerfile)
          echo "key=toolchains-$tc-$gcc9" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p beads/build/.toolchains
          for name in TC GCC9; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" beads/build/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" beads/build/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "beads/build/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  beads/build/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: beads/build/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build shared kit
        run: |
          docker build --platform linux/amd64 \
            --build-arg TC_LOCAL=.toolchains/TC.tar.bz2 --build-arg GCC9_LOCAL=.toolchains/GCC9.tar.bz2 \
            -t beads-build-kit:gcc9 beads/build
          docker save --output /tmp/beads-build-kit.tar beads-build-kit:gcc9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beads-mutation-build-kit
          path: /tmp/beads-build-kit.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  mutations:
    needs: build-kit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every 8th case from `shard`, so the 8 shards run each case once.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: beads-mutation-build-kit
          path: /tmp/beads-build-kit
      - name: Load build kit
        run: docker load --input /tmp/beads-build-kit/beads-build-kit.tar
      - name: Break the firmware in each recorded way; every test must fail
        run: |
          mkdir -p "$RUNNER_TEMP/mutation-report"
          docker run --rm --network none -v "$PWD:/src" \
            -v "$RUNNER_TEMP/mutation-report:/out" -w /src beads-build-kit:gcc9 \
            python3 beads/test/mutation_check.py --shard ${{ matrix.shard }}/8 /out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/mutation-report/
  report:
    needs: mutations
    # Runs even when a shard failed, so this check fails instead of skipping.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: test "${{ needs.mutations.result }}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize stmlib
        run: git submodule update --init stmlib
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-shard-*
          path: shards
      - name: Merge the shards; every case must have run
        run: python3 beads/test/mutation_check.py --merge "$PWD/mutation-report" shards/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          if-no-files-found: error
          path: mutation-report/
