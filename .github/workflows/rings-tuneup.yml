name: Rings tuneup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init stmlib stm_audio_bootloader
      # A checkout writes resources.cc before the scripts that generate it,
      # and make would then regenerate it with today's stmlib.
      - name: Keep the committed resources
        run: touch rings/resources.cc
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: insolentconstruct/mutable-dev-environment
          ref: ad1d1f7629b29c3f5043377108b7d9256853be57
          path: mutable-dev-environment
          persist-credentials: false
      # The GCC archives are cached by their pinned sha256, so a Launchpad outage does not fail CI.
      - name: Read the pinned toolchain hashes
        id: toolchains
        run: |
          gcc48=$(sed -n 's/^ARG GCC48_SHA256=//p' mutable-dev-environment/Dockerfile)
          gcc49=$(sed -n 's/^ARG GCC49_SHA256=//p' mutable-dev-environment/Dockerfile)
          echo "key=toolchains-$gcc48-$gcc49" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain archives
        id: restore-toolchains
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mutable-dev-environment/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Download the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p mutable-dev-environment/.toolchains
          for name in GCC48 GCC49; do
            url=$(sed -n "s/^ARG ${name}_URL=//p" mutable-dev-environment/Dockerfile)
            sha=$(sed -n "s/^ARG ${name}_SHA256=//p" mutable-dev-environment/Dockerfile)
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 30 --connect-timeout 30 --max-time 900 \
              -o "mutable-dev-environment/.toolchains/$name.tar.bz2" "$url"
            echo "$sha  mutable-dev-environment/.toolchains/$name.tar.bz2" | sha256sum -c -
          done
      - name: Save the toolchain archives
        if: steps.restore-toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: mutable-dev-environment/.toolchains
          key: ${{ steps.toolchains.outputs.key }}
      - name: Build the image
        run: |
          mutable-dev-environment/mutable image --build-arg GCC48_LOCAL=.toolchains/GCC48.tar.bz2 \
            --build-arg GCC49_LOCAL=.toolchains/GCC49.tar.bz2
      - name: Host render tests
        run: mutable-dev-environment/mutable -C . render rings
      - name: Build the application, bootloader and update file
        run: |
          mutable-dev-environment/mutable -C . make -f rings/makefile
          mutable-dev-environment/mutable -C . make -f rings/bootloader/makefile
          mutable-dev-environment/mutable -C . make -f rings/makefile wav
      - name: Check firmware hashes
        run: sha256sum -c rings/tuneup/expected-hashes.sha256
