<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="252.92mm" viewBox="0 0 1060 1411" role="img" aria-labelledby="title desc">
<title id="title">Options page control guide</title>
<desc id="desc">Three pages of mix knob settings with MEDIA colour and blink indications. Full text version in OPTIONS.md.</desc>
<metadata>Author: Insolent Construct</metadata>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#222">
<text x="35" y="35" font-size="22" font-weight="bold">OPTIONS / CONTROL GUIDE</text>
<text x="35" y="56" font-size="12" font-weight="normal">ASSIGN • SEED • FREEZE • MEDIA • MIX</text>
<circle cx="70" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="44" y="110" font-size="11" font-weight="normal">ASSIGN</text>
<circle cx="155" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="129" y="110" font-size="11" font-weight="normal">SEED</text>
<circle cx="240" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="214" y="110" font-size="11" font-weight="normal">FREEZE</text>
<circle cx="325" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="299" y="110" font-size="11" font-weight="normal">MEDIA LED</text>
<text x="35" y="125" font-size="13" font-weight="normal">Enter: hold ASSIGN alone 3 s with mix knobs still, then</text>
<text x="35" y="143" font-size="13" font-weight="normal">release.</text>
<text x="35" y="161" font-size="13" font-weight="normal">Next page: tap ASSIGN. Pages cycle 1 → 2 → 3 → 1.</text>
<text x="35" y="179" font-size="13" font-weight="normal">Leave: hold ASSIGN 3 s or press another button (SEED exception</text>
<text x="35" y="197" font-size="13" font-weight="normal">below).</text>
<text x="35" y="215" font-size="13" font-weight="normal">Save: rest the knob 1 s; the page LED flashes briefly (100 ms).</text>
<text x="535" y="125" font-size="13" font-weight="normal">Pending edits save after leaving too. Wait 1 s before powering</text>
<text x="535" y="143" font-size="13" font-weight="normal">off.</text>
<text x="535" y="161" font-size="13" font-weight="normal">Move a knob more than 10% to begin editing. Reserved knobs do</text>
<text x="535" y="179" font-size="13" font-weight="normal">nothing.</text>
<text x="535" y="197" font-size="13" font-weight="normal">MEDIA shows the first setting on entry, then the last qualified</text>
<text x="535" y="215" font-size="13" font-weight="normal">knob moved.</text>
<text x="535" y="233" font-size="13" font-weight="normal">No idle exit or cancel. Reopening remembers the page until</text>
<text x="535" y="251" font-size="13" font-weight="normal">power-off.</text>
<text x="35" y="277" font-size="12" font-weight="normal">MEDIA: solid ring = steady; dashed ring = slow ≈1 Hz; dotted ring = fast ≈4 Hz.</text>
<text x="35" y="294" font-size="12" font-weight="normal">Two dots = two yellow pulses then a pause (2.048 s group). Colour is also named.</text>
<text x="35" y="311" font-size="12" font-weight="normal">Width meter: slow green → yellow → red for zero → full enabled spread.</text>
<text x="35" y="328" font-size="12" font-weight="normal">First value = steady green. Reserved = MEDIA unchanged. Page LED ≠ MEDIA.</text>
<circle cx="45" cy="350" r="7" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="57" y="354" font-size="10" font-weight="normal">steady</text>
<circle cx="133" cy="350" r="7" fill="white" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="145" y="354" font-size="10" font-weight="normal">slow</text>
<circle cx="221" cy="350" r="7" fill="white" stroke="#222" stroke-width="1.5" stroke-dasharray="1 3"/>
<text x="233" y="354" font-size="10" font-weight="normal">fast</text>
<circle cx="309" cy="350" r="7" fill="white" stroke="#222" stroke-width="1.5"/>
<circle cx="306" cy="350" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="312" cy="350" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="321" y="354" font-size="10" font-weight="normal">two pulses</text>
<text x="35" y="385" font-size="17" font-weight="bold">PAGE 1 / REVERB LED PULSES</text>
<circle cx="325" cy="410" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
