<text x="35" y="1301" font-size="12" font-weight="normal">Arc numbers match values below (CCW to CW); edges have a 3% dead band.</text>
<text x="35" y="1316" font-size="12" font-weight="normal">Pitch: Off / Chromatic / Scale in thirds. On Scale, tap SEED to cycle</text>
<text x="35" y="1331" font-size="12" font-weight="normal">the eight scales below in order. Holds do not cycle; taps do not play</text>
<text x="35" y="1346" font-size="12" font-weight="normal">grains.</text>
<text x="35" y="1361" font-size="12" font-weight="normal">Width: Stock below 10%; leave above 13%, return below 7%.</text>
<text x="535" y="1301" font-size="12" font-weight="normal">Enabled width runs from zero spread at 13% to full spread at 100%.</text>
<text x="535" y="1316" font-size="12" font-weight="normal">Zero preserves stereo position (mono centred); changes affect new</text>
<text x="535" y="1331" font-size="12" font-weight="normal">grains.</text>
<text x="535" y="1346" font-size="12" font-weight="normal">All three mix LEDs pulse on entry; one marks the page thereafter.</text>
<text x="535" y="1361" font-size="12" font-weight="normal">The page LED flashes on entry, exit and after saving changed values.</text>
<text x="35" y="1388" font-size="10" font-weight="normal">Author: Insolent Construct • Generated control schematic</text>
</g>
</svg>
