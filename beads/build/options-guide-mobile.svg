<text x="191.0" y="1916.0" font-size="12" font-weight="bold">1</text>
<circle cx="25" cy="2018" r="5" fill="#777" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2022" font-size="13" font-weight="normal">1. Reserved: unchanged, steady</text>
<text x="20" y="2090" font-size="17" font-weight="bold">PAGE 3 / DRY/WET LED PULSES</text>
<circle cx="350" cy="2115" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="2120" font-size="16" font-weight="bold">FEEDBACK</text>
<text x="20" y="2140" font-size="14" font-weight="normal">Self-play</text>
<circle cx="195.0" cy="2199" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 2199 v -16" stroke="#222" stroke-width="2"/>
<path d="M 167.400 2223.642 A 37 37 0 0 1 192.909 2162.059" fill="none" stroke="#222" stroke-width="3"/>
<text x="144.81" y="2183.87" font-size="12" font-weight="bold">1</text>
<path d="M 197.091 2162.059 A 37 37 0 0 1 222.600 2223.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="237.19" y="2183.87" font-size="12" font-weight="bold">2</text>
<circle cx="25" cy="2255" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2259" font-size="13" font-weight="normal">1. Automatic (Stock): green, steady</text>
<circle cx="25" cy="2272" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2276" font-size="13" font-weight="normal">2. On request: yellow, steady</text>
<circle cx="350" cy="2322" r="6" fill="#222" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="2327" font-size="16" font-weight="bold">DRY/WET</text>
<text x="20" y="2347" font-size="14" font-weight="normal">Limiter</text>
