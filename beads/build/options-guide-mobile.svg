<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3137" viewBox="0 0 390 3137" role="img" aria-labelledby="title desc">
<title id="title">Options page control guide</title>
<desc id="desc">Three pages of mix knob settings with MEDIA colour and blink indications. Full text version in OPTIONS.md.</desc>
<metadata>Author: Insolent Construct</metadata>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#222">
<text x="22" y="35" font-size="24" font-weight="bold" fill="#222" text-anchor="start">YOUR OPTIONS</text>
<text x="22" y="70" font-size="15" font-weight="normal" fill="#222" text-anchor="start">1. Open: hold ASSIGN 3 s, release.</text>
<text x="22" y="96" font-size="15" font-weight="normal" fill="#222" text-anchor="start">2. Change page: tap ASSIGN. The pulsing mix</text>
<text x="22" y="117" font-size="15" font-weight="normal" fill="#222" text-anchor="start">LED marks the page (F / D/W / R).</text>
<text x="22" y="143" font-size="15" font-weight="normal" fill="#222" text-anchor="start">3. Change a setting: turn its knob; it</text>
<text x="22" y="164" font-size="15" font-weight="normal" fill="#222" text-anchor="start">saves when you let go (the page LED</text>
<text x="22" y="185" font-size="15" font-weight="normal" fill="#222" text-anchor="start">flashes).</text>
<text x="22" y="211" font-size="15" font-weight="normal" fill="#222" text-anchor="start">4. Close: hold ASSIGN 3 s, or press any</text>
<text x="22" y="232" font-size="15" font-weight="normal" fill="#222" text-anchor="start">other button.</text>
<text x="22" y="258" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Turn a knob a little before it responds.</text>
<text x="22" y="279" font-size="15" font-weight="normal" fill="#222" text-anchor="start">Wait a second before powering off.</text>
<text x="22" y="315" font-size="17" font-weight="bold" fill="#222" text-anchor="start">FIND THE CONTROLS</text>
<rect x="22" y="329" width="310" height="240" rx="12" fill="#f6f5f0" stroke="#aaa"/>
<circle cx="64" cy="360" r="10" fill="white" stroke="#333" stroke-width="2"/>
<text x="64" y="389" font-size="15" font-weight="normal" fill="#222" text-anchor="middle">FREEZE</text>
