<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3023" viewBox="0 0 390 3023" role="img" aria-labelledby="title desc">
<title id="title">Options page control guide</title>
<desc id="desc">Three pages of mix knob settings with MEDIA colour and blink indications. Full text version in OPTIONS.md.</desc>
<metadata>Author: Insolent Construct</metadata>
<rect width="100%" height="100%" fill="white"/>
<g font-family="sans-serif" fill="#222">
<text x="20" y="35" font-size="22" font-weight="bold">OPTIONS / CONTROL GUIDE</text>
<text x="20" y="56" font-size="12" font-weight="normal">ASSIGN • SEED • FREEZE • MEDIA • MIX</text>
<circle cx="55" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="29" y="110" font-size="11" font-weight="normal">ASSIGN</text>
<circle cx="140" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="114" y="110" font-size="11" font-weight="normal">SEED</text>
<circle cx="225" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="199" y="110" font-size="11" font-weight="normal">FREEZE</text>
<circle cx="310" cy="86" r="10" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="284" y="110" font-size="11" font-weight="normal">MEDIA LED</text>
<text x="20" y="145" font-size="13" font-weight="normal">Enter: hold ASSIGN alone 3 s with mix knobs</text>
<text x="20" y="163" font-size="13" font-weight="normal">still, then release.</text>
<text x="20" y="181" font-size="13" font-weight="normal">Next page: tap ASSIGN. Pages cycle 1 → 2 → 3 → 1.</text>
<text x="20" y="199" font-size="13" font-weight="normal">Leave: hold ASSIGN 3 s or press another button</text>
<text x="20" y="217" font-size="13" font-weight="normal">(SEED exception below).</text>
<text x="20" y="235" font-size="13" font-weight="normal">Save: rest the knob 1 s; the page LED flashes</text>
<text x="20" y="253" font-size="13" font-weight="normal">briefly (100 ms).</text>
<text x="20" y="271" font-size="13" font-weight="normal">Pending edits save after leaving too. Wait 1 s</text>
<text x="20" y="289" font-size="13" font-weight="normal">before powering off.</text>
<text x="20" y="307" font-size="13" font-weight="normal">Move a knob more than 10% to begin editing.</text>
<text x="20" y="325" font-size="13" font-weight="normal">Reserved knobs do nothing.</text>
<text x="20" y="343" font-size="13" font-weight="normal">MEDIA shows the first setting on entry, then the</text>
<text x="20" y="361" font-size="13" font-weight="normal">last qualified knob moved.</text>
<text x="20" y="379" font-size="13" font-weight="normal">No idle exit or cancel. Reopening remembers the</text>
<text x="20" y="397" font-size="13" font-weight="normal">page until power-off.</text>
<text x="20" y="423" font-size="12" font-weight="normal">MEDIA: solid ring = steady; dashed ring = slow ≈1</text>
<text x="20" y="440" font-size="12" font-weight="normal">Hz; dotted ring = fast ≈4 Hz.</text>
<text x="20" y="457" font-size="12" font-weight="normal">Two dots = two yellow pulses then a pause (2.048</text>
<text x="20" y="474" font-size="12" font-weight="normal">s group). Colour is also named.</text>
<text x="20" y="491" font-size="12" font-weight="normal">Width meter: slow green → yellow → red for zero →</text>
<text x="20" y="508" font-size="12" font-weight="normal">full enabled spread.</text>
<text x="20" y="525" font-size="12" font-weight="normal">First value = steady green. Reserved = MEDIA</text>
<text x="20" y="542" font-size="12" font-weight="normal">unchanged. Page LED ≠ MEDIA.</text>
<circle cx="30" cy="564" r="7" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="42" y="568" font-size="10" font-weight="normal">steady</text>
<circle cx="118" cy="564" r="7" fill="white" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="130" y="568" font-size="10" font-weight="normal">slow</text>
<circle cx="206" cy="564" r="7" fill="white" stroke="#222" stroke-width="1.5" stroke-dasharray="1 3"/>
<text x="218" y="568" font-size="10" font-weight="normal">fast</text>
<circle cx="294" cy="564" r="7" fill="white" stroke="#222" stroke-width="1.5"/>
<circle cx="291" cy="564" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="297" cy="564" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="306" y="568" font-size="10" font-weight="normal">two pulses</text>
<text x="20" y="599" font-size="17" font-weight="bold">PAGE 1 / REVERB LED PULSES</text>
<circle cx="350" cy="624" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="629" font-size="16" font-weight="bold">FEEDBACK</text>
<text x="20" y="649" font-size="14" font-weight="normal">Pitch scale</text>
<circle cx="195.0" cy="708" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 708 v -16" stroke="#222" stroke-width="2"/>
<path d="M 167.400 732.642 A 37 37 0 0 1 167.400 683.358" fill="none" stroke="#222" stroke-width="3"/>
<text x="141.0" y="712.0" font-size="12" font-weight="bold">1</text>
<text x="20" y="768" font-size="12" font-weight="normal">1. Off</text>
<path d="M 170.358 680.400 A 37 37 0 0 1 219.642 680.400" fill="none" stroke="#222" stroke-width="3"/>
<text x="191.0" y="662.0" font-size="12" font-weight="bold">2</text>
<text x="20" y="784" font-size="12" font-weight="normal">2. Chromatic</text>
<path d="M 222.600 683.358 A 37 37 0 0 1 222.600 732.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="241.0" y="712.0" font-size="12" font-weight="bold">3</text>
<text x="20" y="800" font-size="12" font-weight="normal">3. Scale: tap SEED</text>
<circle cx="25" cy="820" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="824" font-size="13" font-weight="normal">Off: green, steady</text>
<circle cx="25" cy="837" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<text x="37" y="841" font-size="13" font-weight="normal">Chromatic: yellow, steady</text>
<circle cx="25" cy="854" r="5" fill="#bd3030" stroke="#222" stroke-width="1.5"/>
<text x="37" y="858" font-size="13" font-weight="normal">Fifths and octaves: red, steady</text>
<circle cx="25" cy="871" r="5" fill="#247443" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="37" y="875" font-size="13" font-weight="normal">Major: green, slow</text>
<circle cx="25" cy="888" r="5" fill="#a87900" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="37" y="892" font-size="13" font-weight="normal">Minor: yellow, slow</text>
<circle cx="25" cy="905" r="5" fill="#bd3030" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="37" y="909" font-size="13" font-weight="normal">Major pentatonic: red, slow</text>
<circle cx="25" cy="922" r="5" fill="#247443" stroke="#222" stroke-width="1.5" stroke-dasharray="1 3"/>
<text x="37" y="926" font-size="13" font-weight="normal">Minor pentatonic: green, fast</text>
<circle cx="25" cy="939" r="5" fill="#a87900" stroke="#222" stroke-width="1.5" stroke-dasharray="1 3"/>
<text x="37" y="943" font-size="13" font-weight="normal">Pelog: yellow, fast</text>
<circle cx="25" cy="956" r="5" fill="#bd3030" stroke="#222" stroke-width="1.5" stroke-dasharray="1 3"/>
<text x="37" y="960" font-size="13" font-weight="normal">Raag Bhairav: red, fast</text>
<circle cx="25" cy="973" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<circle cx="22" cy="973" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<circle cx="28" cy="973" r="1" fill="#222" stroke="#222" stroke-width="1.5"/>
<text x="37" y="977" font-size="13" font-weight="normal">Raag Shri: yellow, two pulses</text>
<circle cx="350" cy="1013" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="1018" font-size="16" font-weight="bold">DRY/WET</text>
<text x="20" y="1038" font-size="14" font-weight="normal">Stereo width</text>
<circle cx="195.0" cy="1097" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 1097 v -16" stroke="#222" stroke-width="2"/>
<path d="M 167.400 1121.642 A 37 37 0 0 1 160.513 1110.404" fill="none" stroke="#222" stroke-width="3"/>
