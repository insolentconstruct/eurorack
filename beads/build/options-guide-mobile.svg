<path d="M 170.358 2378.400 A 37 37 0 0 1 219.642 2378.400" fill="none" stroke="#222" stroke-width="3"/>
<text x="191.0" y="2360.0" font-size="12" font-weight="bold">2</text>
<path d="M 222.600 2381.358 A 37 37 0 0 1 222.600 2430.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="241.0" y="2410.0" font-size="12" font-weight="bold">3</text>
<circle cx="25" cy="2462" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2466" font-size="13" font-weight="normal">1. Stock: green, steady</text>
<circle cx="25" cy="2479" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2483" font-size="13" font-weight="normal">2. Fast release: yellow, steady</text>
<circle cx="25" cy="2496" r="5" fill="#bd3030" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2500" font-size="13" font-weight="normal">3. Off: red, steady</text>
<circle cx="350" cy="2536" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="2541" font-size="16" font-weight="bold">REVERB</text>
<text x="20" y="2561" font-size="14" font-weight="normal">Reserved</text>
<circle cx="195.0" cy="2620" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 2620 v -16" stroke="#222" stroke-width="2"/>
<path d="M 167.400 2644.642 A 37 37 0 1 1 222.600 2644.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="191.0" y="2574.0" font-size="12" font-weight="bold">1</text>
<circle cx="25" cy="2676" r="5" fill="#777" stroke="#222" stroke-width="1.5"/>
<text x="37" y="2680" font-size="13" font-weight="normal">1. Reserved: unchanged, steady</text>
<text x="20" y="2748" font-size="12" font-weight="normal">Arc numbers match values below (CCW to CW); edges</text>
<text x="20" y="2763" font-size="12" font-weight="normal">have a 3% dead band.</text>
<text x="20" y="2778" font-size="12" font-weight="normal">Pitch: Off / Chromatic / Scale in thirds. On</text>
<text x="20" y="2793" font-size="12" font-weight="normal">Scale, tap SEED to cycle</text>
<text x="20" y="2808" font-size="12" font-weight="normal">the eight scales below in order. Holds do not</text>
<text x="20" y="2823" font-size="12" font-weight="normal">cycle; taps do not play grains.</text>
<text x="20" y="2838" font-size="12" font-weight="normal">Width: Stock below 10%; leave above 13%, return</text>
<text x="20" y="2853" font-size="12" font-weight="normal">below 7%.</text>
<text x="20" y="2868" font-size="12" font-weight="normal">Enabled width runs from zero spread at 13% to</text>
<text x="20" y="2883" font-size="12" font-weight="normal">full spread at 100%.</text>
<text x="20" y="2898" font-size="12" font-weight="normal">Zero preserves stereo position (mono centred);</text>
<text x="20" y="2913" font-size="12" font-weight="normal">changes affect new grains.</text>
<text x="20" y="2928" font-size="12" font-weight="normal">All three mix LEDs pulse on entry; one marks the</text>
<text x="20" y="2943" font-size="12" font-weight="normal">page thereafter.</text>
<text x="20" y="2958" font-size="12" font-weight="normal">The page LED flashes on entry, exit and after</text>
<text x="20" y="2973" font-size="12" font-weight="normal">saving changed values.</text>
<text x="20" y="3000" font-size="10" font-weight="normal">Author: Insolent Construct • Generated control schematic</text>
</g>
</svg>
