<text x="191.0" y="1495.0" font-size="12" font-weight="bold">1</text>
<circle cx="25" cy="1597" r="5" fill="#777" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1601" font-size="13" font-weight="normal">1. Reserved: unchanged, steady</text>
<circle cx="350" cy="1664" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="1669" font-size="16" font-weight="bold">DRY/WET</text>
<text x="20" y="1689" font-size="14" font-weight="normal">Delay mode</text>
<circle cx="195.0" cy="1748" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 1748 v -16" stroke="#222" stroke-width="2"/>
<path d="M 167.400 1772.642 A 37 37 0 0 1 167.400 1723.358" fill="none" stroke="#222" stroke-width="3"/>
<text x="141.0" y="1752.0" font-size="12" font-weight="bold">1</text>
<path d="M 170.358 1720.400 A 37 37 0 0 1 219.642 1720.400" fill="none" stroke="#222" stroke-width="3"/>
<text x="191.0" y="1702.0" font-size="12" font-weight="bold">2</text>
<path d="M 222.600 1723.358 A 37 37 0 0 1 222.600 1772.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="241.0" y="1752.0" font-size="12" font-weight="bold">3</text>
<circle cx="25" cy="1804" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1808" font-size="13" font-weight="normal">1. Auto (Stock): green, steady</text>
<circle cx="25" cy="1821" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1825" font-size="13" font-weight="normal">2. Never: yellow, steady</text>
<circle cx="25" cy="1838" r="5" fill="#bd3030" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1842" font-size="13" font-weight="normal">3. Wide detent: red, steady</text>
<circle cx="350" cy="1878" r="6" fill="white" stroke="#222" stroke-width="1.5"/>
<text x="20" y="1883" font-size="16" font-weight="bold">REVERB</text>
<text x="20" y="1903" font-size="14" font-weight="normal">Reserved</text>
<circle cx="195.0" cy="1962" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
