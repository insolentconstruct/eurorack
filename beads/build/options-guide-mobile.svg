<text x="202.67" y="1052.38" font-size="12" font-weight="bold">2</text>
<circle cx="25" cy="1153" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1157" font-size="13" font-weight="normal">1. Stock: green, steady</text>
<circle cx="25" cy="1170" r="5" fill="#777" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="37" y="1174" font-size="13" font-weight="normal">2. Enabled (1..255): G→Y→R meter, slow</text>
