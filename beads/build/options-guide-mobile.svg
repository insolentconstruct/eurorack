<path d="M 197.091 1267.059 A 37 37 0 0 1 222.600 1328.642" fill="none" stroke="#222" stroke-width="3"/>
<text x="237.19" y="1288.87" font-size="12" font-weight="bold">2</text>
<circle cx="25" cy="1360" r="5" fill="#247443" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1364" font-size="13" font-weight="normal">1. Stock: green, steady</text>
<circle cx="25" cy="1377" r="5" fill="#a87900" stroke="#222" stroke-width="1.5"/>
<text x="37" y="1381" font-size="13" font-weight="normal">2. Clouds-style: yellow, steady</text>
<text x="20" y="1432" font-size="17" font-weight="bold">PAGE 2 / FEEDBACK LED PULSES</text>
<circle cx="350" cy="1457" r="6" fill="#222" stroke="#222" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="20" y="1462" font-size="16" font-weight="bold">FEEDBACK</text>
<text x="20" y="1482" font-size="14" font-weight="normal">Reserved</text>
<circle cx="195.0" cy="1541" r="22" fill="white" stroke="#222" stroke-width="1.5"/>
<path d="M 195.0 1541 v -16" stroke="#222" stroke-width="2"/>
