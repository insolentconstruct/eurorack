name = "u-latched-clocked"
description = """SEED latched (locked on). An 8 Hz SEED clock from 2 s to the end, so it\
outlasts the last divider window; DENSITY CV 0 gives no grains, +0.25 and\
+0.5 raise the probability, -0.34 and -0.22 divide the clock by 3 and by 6.\
(DENSITY fully counter-clockwise does not divide: the ratio is 1 there and\
grows toward noon, so the windows sit mid-range.)"""
seconds = 24
tiers = ["emulator", "module"]
behaviours = ["latched-silent", "latched-probability", "latched-divider"]

[panel]
seed_button = "locked"

[stimulus]
generator = "layers"

[[stimulus.layers]]
kind = "sine"
freq = 330.0
amp = 0.12

[[events]]
kind = "trigger"
channel = "seed"
times = { start = 2.0, step = 0.125, count = 176 }

[[events]]
kind = "cv"
channel = "density"
t = 2.0
level = 0.0

[[events]]
kind = "cv"
channel = "density"
t = 6.0
level = 0.25

[[events]]
kind = "cv"
channel = "density"
t = 10.0
level = 0.5

[[events]]
kind = "cv"
channel = "density"
t = 14.0
level = -0.34

[[events]]
kind = "cv"
channel = "density"
t = 18.0
level = -0.22

[[events]]
kind = "cv"
channel = "density"
t = 22.0
level = 0.0

[[rules]]
rule = "silent"
behaviours = ["latched-silent"]
win = [2.5, 5.9]

[[rules]]
rule = "rate_order"
behaviours = ["latched-probability"]
wins = [[6.5, 9.9], [10.5, 13.9]]
clock_hz = 8.0

[[rules]]
rule = "rate_divided"
behaviours = ["latched-divider"]
wins = [[14.5, 17.9], [18.5, 21.9]]
clock_hz = 8.0
ratios = [3, 6]
