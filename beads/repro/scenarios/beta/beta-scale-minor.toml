name = "beta-scale-minor"
description = """Pitch quantized to the minor scale (root C). PITCH attenurandomizer\
fully counter-clockwise, SIZE at 0.75; 24 isolated grains from a C4 tone\
with the pitch randomization depth stepped through four blocks. Each\
grain must sit within 15 cents of a scale degree and the grains must not\
all be the same note. The tone is continuous: its phase is that of a\
tone begun 17 s before the scenario starts, as on the bench."""
seconds = 30
tiers = ["emulator", "module"]
behaviours = ["pitch-scale"]

[panel]
size = 0.75
size_att = 0.0
shape_att = 0.0
time_att = 0.0
pitch_att = 0.0
pitch_scale = "minor"

[stimulus]
generator = "layers"

[[stimulus.layers]]
kind = "sine"
freq = 261.625565
amp = 0.12
fade_s = 0.0
phase_s = 17.0

[[events]]
kind = "trigger"
channel = "seed"
times = { start = 3.0, step = 1.0, count = 24 }
width = 0.45

[[events]]
kind = "cv"
channel = "pitch"
t = 2.9
level = -0.6

[[events]]
kind = "cv"
channel = "pitch"
t = 8.9
level = 0.0

[[events]]
kind = "cv"
channel = "pitch"
t = 14.9
level = 0.15

[[events]]
kind = "cv"
channel = "pitch"
t = 20.9
level = 0.3

[[rules]]
rule = "random_side_statistics"
behaviours = ["pitch-scale"]
control = "pitch"

[[rules]]
rule = "grain_pitch_scale"
behaviours = ["pitch-scale"]
scale = "minor"
