name = "beta-media2-delay"
description = """The u-delay scenario with the vintage digital medium stored."""
seconds = 30
tiers = ["emulator", "module"]
behaviours = ["delay-echo", "delay-loop", "delay-pitch-shift"]

[guard]
delay_mode = "always"

[panel]
size = 1.0
media = "vintage_digital"

[stimulus]
generator = "layers"

[[stimulus.layers]]
kind = "sine"
freq = 660.0
amp = 0.2
start = 1.5
every = 3.0
count = 10
dur_s = 0.03
fade_s = 0.002

[[stimulus.layers]]
kind = "noise"
amp = 0.1
seed = 20261017
start = 14.3
stop = 16.4
fade_s = 0.01

[[events]]
kind = "trigger"
channel = "seed"
times = { start = 2.0, step = 0.5, count = 12 }

[[events]]
kind = "trigger"
channel = "seed"
times = { start = 9.0, step = 0.3, count = 20 }

[[events]]
kind = "hold"
channel = "freeze"
t0 = 17.0
t1 = 23.0

[[events]]
kind = "cv"
channel = "pitch"
t = 24.0
level = 0.2

[[events]]
kind = "cv"
channel = "pitch"
t = 28.0
level = 0.0

[[rules]]
rule = "echo_peak_ratio"
behaviours = ["delay-echo"]
bursts_a = [4.5, 7.5]
bursts_b = [13.5, 16.5]
measure_only = true

[[rules]]
rule = "loop_period"
behaviours = ["delay-loop"]
win = [18.0, 22.9]
period = 0.3
tol = 0.03

[[rules]]
rule = "pitch_shift"
behaviours = ["delay-pitch-shift"]
base = [19.0, 22.9]
test = [25.0, 27.9]
measure_only = true
